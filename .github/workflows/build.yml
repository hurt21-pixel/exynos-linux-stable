name: Exynos Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make gcc clang python3 git zip lz4 cpio \
          lld binutils-aarch64-linux-gnu

    - name: Set up environment
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export PATH=$PATH:/usr/bin

    - name: Prepare defconfig
      run: |
        cp .config .config
        make olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc)

    - name: Pack boot.img
      run: |
        mkdir -p out
        cp arch/arm64/boot/Image.gz out/
        cp arch/arm64/boot/dts/exynos/*.dtb out/
        cat out/Image.gz out/*.dtb > out/Image.gz-dtb

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: out/Image.gz-dtb
