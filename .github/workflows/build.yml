name: Exynos Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make gcc python3 git zip lz4 cpio \
          lld-14 clang-14 llvm-14 binutils-aarch64-linux-gnu

    - name: Build kernel
      run: |
        # Membuat folder output
        mkdir -p out

        # Setup Path untuk Toolchain
        export PATH="/usr/lib/llvm-14/bin:/usr/bin:$PATH"
        
        # Eksekusi Make Config (Langsung tembak nama filenya)
        make O=out ARCH=arm64 starlte_defconfig
        
        # Paksa isi default untuk config baru
        make O=out ARCH=arm64 olddefconfig

        # Proses Compile dengan Clang 14
        # Kita pakai 'ld.lld' (tanpa -14) karena biasanya otomatis terlink setelah install lld-14
        make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang-14 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 \
            LLVM=1 \
            LLVM_IAS=1

    - name: Pack Image.gz-dtb
      run: |
        mkdir -p final_out
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz final_out/
          # Cari file .dtb dan gabungkan
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} final_out/ \;
          cd final_out
          cat Image.gz *.dtb > Image.gz-dtb
          echo "Build Success!"
        else
          echo "Error: Image.gz tidak ditemukan!"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-starlte-clang14
        path: final_out/Image.gz-dtb
        
