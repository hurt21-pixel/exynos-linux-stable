name: Exynos Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make gcc python3 git zip lz4 cpio \
          lld-14 clang-14 llvm-14 binutils-aarch64-linux-gnu

    - name: Build kernel
      run: |
        # 1. Setup Folder & Path
        mkdir -p out
        export PATH="/usr/lib/llvm-14/bin:/usr/bin:$PATH"
        
        # 2. Definisikan Toolchain (Pakai Clang 14)
        # LLVM=1 akan otomatis mengatur CC, LD, AR, dll ke versi LLVM
        # Kita tambahkan suffix -14 supaya pasti pakai versi yang diminta
        args="O=out \
              ARCH=arm64 \
              SUBARCH=arm64 \
              CC=clang-14 \
              LD=ld.lld-14 \
              AR=llvm-ar-14 \
              NM=llvm-nm-14 \
              OBJCOPY=llvm-objcopy-14 \
              OBJDUMP=llvm-objdump-14 \
              STRIP=llvm-strip-14 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=1"

        # 3. Masukkan Config (Gunakan starlte_defconfig)
        make $args starlte_defconfig
        
        # 4. KUNCI: Set semua opsi baru ke default (Menghindari error 'Aborted')
        make $args olddefconfig

        # 5. Mulai Compile
        make -j$(nproc) $args

    - name: Pack Image.gz-dtb
      run: |
        mkdir -p final_out
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz final_out/
          # Ambil semua file .dtb
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} final_out/ \;
          cd final_out
          # Gabungkan Image.gz dan DTB menjadi satu file
          cat Image.gz *.dtb > Image.gz-dtb
          echo "Build Selesai dengan Sukses!"
        else
          echo "Error: File Image.gz tidak ditemukan!"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-starlte-clang14
        path: final_out/Image.gz-dtb
        
