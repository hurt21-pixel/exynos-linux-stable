name: Exynos Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang python3 git zip

    - name: Export toolchain
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld

    - name: Apply KernelSU Next
      run: |
        git clone https://github.com/tiann/KernelSU.git
        cp -r KernelSU/kernel drivers/kernelsu
        echo "obj-y += kernelsu/" >> drivers/Makefile
        echo "CONFIG_KSU=y" >> .config

    - name: Build kernel
      run: |
        make starlte_defconfig
        make olddefconfig
        make -j$(nproc)

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v3
      with:
        name: kernel-output
        path: arch/arm64/boot/Image.gz-dtb
