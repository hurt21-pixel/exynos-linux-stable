name: Exynos Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang python3 git zip lz4 cpio

    - name: Export toolchain
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV

    - name: Apply KernelSU Next
      run: |
        git clone https://github.com/tiann/KernelSU.git
        cp -r KernelSU/kernel drivers/kernelsu
        echo "obj-y += kernelsu/" >> drivers/Makefile
        echo "CONFIG_KSU=y" >> .config

    - name: Build kernel
      run: |
        make starlte_defconfig
        make olddefconfig
        make -j$(nproc)

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: arch/arm64/boot/Image.gz-dtb

    - name: Repack boot.img
      run: |
        mkdir -p out
        git clone https://github.com/osm0sis/mkbootimg.git
        chmod +x mkbootimg/mkbootimg.py

        # Extract base boot.img (assumes you have boot/boot.img in repo)
        mkdir bootimg
        cd bootimg
        ../mkbootimg/unpackbootimg.py ../boot/boot.img
        cd ..

        # Replace kernel
        cp arch/arm64/boot/Image.gz-dtb bootimg/zImage

        # Repack boot.img
        mkbootimg/mkbootimg.py --kernel bootimg/zImage \
          --ramdisk bootimg/ramdisk.gz \
          --cmdline "$(cat bootimg/cmdline)" \
          --base "$(cat bootimg/base)" \
          --pagesize "$(cat bootimg/pagesize)" \
          --kernel_offset "$(cat bootimg/kernel_offset)" \
          --ramdisk_offset "$(cat bootimg/ramdisk_offset)" \
          --tags_offset "$(cat bootimg/tags_offset)" \
          -o out/boot.img

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: boot-image
        path: out/boot.img
